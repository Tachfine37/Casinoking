kind = "web"
previewPath = "/"
title = "CasinoKing Blog"
version = "1.0.0"
id = "artifacts/casino-blog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20247

[services.development]
run = "pnpm --filter @workspace/casino-blog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/casino-blog", "run", "build" ]
publicDir = "artifacts/casino-blog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20247"
BASE_PATH = "/"
